version: '3.8'

services:
  ynab-mcp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - YNAB_API_TOKEN=${YNAB_API_TOKEN}
      - YNAB_BUDGET_ID=${YNAB_BUDGET_ID:-}
      - MCP_TRANSPORT=http
      - MCP_API_KEY=${MCP_API_KEY:-}
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
